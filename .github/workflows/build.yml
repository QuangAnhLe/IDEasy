name: CI build
on:
  push:
    paths-ignore:
      - 'documentation/**'
    branches: [ test ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Run shell function tests
        shell: bash
        run: bash cli/src/test/functions-test.sh
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build project with Maven
        run: mvn -B -ntp -Dstyle.color=always install
      - name: Sonarcloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=quanganhle \
            -Dsonar.projectKey=QuangAnhLe_IDEasy \
            -Dsonar.token=${SONAR_TOKEN}
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.2.3
